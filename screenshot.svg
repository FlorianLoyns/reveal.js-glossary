<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" width="820" height="280" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0B1818" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="804" height="264" rx="18" fill="#FFFFFF" stroke="#E7EBEF" stroke-width="1.5"/>
  <text x="34" y="46" font-size="15" font-weight="700" letter-spacing="0.12em" fill="#2C4A6E">GLOSSARY</text>
  <text x="34" y="68" font-size="13.5" fill="#6B7B7B">Hover or tap a term — a short definition pops up next to it.</text>

  <!-- definition popup (light card) -->
  <g filter="url(#sh)">
    <rect x="255" y="96" width="310" height="70" rx="12" fill="#FFFFFF" stroke="#E7EBEF" stroke-width="1.5"/>
  </g>
  <text x="272" y="123" font-size="15" fill="#39484a">A pressure ulcer caused by sustained</text>
  <text x="272" y="146" font-size="15" fill="#39484a">pressure on the skin.</text>
  <!-- arrow (border + fill) -->
  <polygon points="400,166 420,166 410,180" fill="#E7EBEF"/>
  <polygon points="401.5,166 418.5,166 410,178" fill="#FFFFFF"/>

  <!-- slide sentence with the underlined term -->
  <text x="392" y="228" text-anchor="end" font-size="19" fill="#0B1818">The nurse documents a </text>
  <text x="396" y="228" font-size="19" fill="#0B1818">decubitus</text>
  <line x1="396" y1="234" x2="486" y2="234" stroke="#0B1818" stroke-width="1.5"/>
  <text x="487" y="228" font-size="19" fill="#0B1818">.</text>
</svg>
